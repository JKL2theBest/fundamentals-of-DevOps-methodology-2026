---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-monitor
  template:
    metadata:
      labels:
        app: flask-monitor
    spec:
      containers:
        - name: flask
          image: my-flask-app:3.0
          imagePullPolicy: Never
          ports:
            # Имя порта ВАЖНА для ServiceMonitor
            - name: web
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-svc
  labels:
    app: flask-monitor
spec:
  type: NodePort
  selector:
    app: flask-monitor
  ports:
    - name: web
      port: 8000
      targetPort: 8000
---
# Специальный ресурс, который укажет Prometheus собирать метрики с приложения
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-sm
  labels:
    # Чтобы Helm-чарт Prometheus нашел этот конфиг
    release: monitoring
spec:
  selector:
    matchLabels:
      app: flask-monitor
  endpoints:
    - port: web
      path: /metrics
